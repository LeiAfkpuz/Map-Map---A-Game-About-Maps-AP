# Example player options for Map Map - A Game About Maps.
# Change "name" to your slot name, adjust the options, and give this file to whoever generates the game.

name: YourName
game: Map Map - A Game About Maps

Map Map - A Game About Maps:
  # island_20: enter the Raven King's Treasure Cave on Island 20 (the ending)
  # islands_completed: complete every mission on `islands_required` islands
  # all_three_stars: earn 3 stars on every mission that has a rating (forces star_checks on)
  goal: island_20

  # Only used by the islands_completed goal (1-20).
  islands_required: 10

  # Optional check types (true = included).
  star_checks: true
  treasure_checks: true
  floor_is_lava_checks: true

  # Put Dividers (Islands 7-20) and Telescope (Islands 17-20) in logic. They're never strictly required.
  helpful_tool_logic: true

  # Death Link: drowning kills everyone else with Death Link; their deaths reload your current island.
  death_link: false
